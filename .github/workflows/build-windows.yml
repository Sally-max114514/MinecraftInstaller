name: 打包 Windows EXE

# 推送代码或在 Actions 页面手动点击即可触发打包
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MinecraftInstaller2.0
          --icon icon.ico
          --version-file version_info.txt
          MinecraftInstaller2.0.py

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftInstaller2.0-windows
          path: dist/MinecraftInstaller2.0.exe
